type: hik # (daheng/hik）
# 共享内存发布（供 detector/solver 零拷贝取帧）；区域名/槽数见 config/shm.yaml, 槽位分辨率取当前相机的 width/height
publish_shm: true
shm_region: ""   # 空 = 用 shm 默认区域（wit_engineer_image）

hik_camera:
  sn: "DA3038934"
  fps: 200.0
  # 输出分辨率; 共享内存槽位大小也按这里算
  width: 1440
  height: 1080
  binning: 1
  exposure_us: 8500.0
  gain: 16.0
  bayer_mode: 0
  wb_mode: "continuous"
  wb_r: 1.0
  wb_g: 1.0
  wb_b: 1.0
  # 触发: false=连续采图; true=触发模式
  trigger_enable: false
  # 触发源: software | line0 | line1 | line2 | line3
  trigger_source: "software"
  # 掉线重试间隔 / 无新帧重启超时（秒）
  retry_interval_s: 2.0
  no_frame_timeout_s: 3.0
  frame_id: "camera"
  camera_info_topic: "/camera/camera_info"
daheng_camera:
  sn: ""
  fps: 200.0
  width: 960
  height: 720
  binning: 1
  exposure_us: 3000.0
  gain: 16.0
  bayer_mode: 0
  wb_mode: "continuous"
  wb_r: 1.0
  wb_g: 1.0
  wb_b: 1.0
  trigger_enable: false
  trigger_source: "software"
  retry_interval_s: 2.0
  no_frame_timeout_s: 3.0
  frame_id: "camera"
  camera_info_topic: "/camera/camera_info"

